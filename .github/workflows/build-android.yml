name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # GitHub Ubuntu 镜像自带 Android SDK
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 JS 依赖
        run: |
          npm config set legacy-peer-deps true
          npm config set fetch-retries 5
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 应用依赖补丁
        run: node dependencies-patch.js
        continue-on-error: true

      # 内部版本号 = 本次构建号。必须在打包 JS bundle 之前写入，
      # 这样 RN 的 require('./buildInfo.json') 与 gradle 读到的构建号一致。
      - name: 写入构建号（内部版本号）
        run: node tools/set-build-number.js

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 校验 Android SDK 并准备工具链
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo "（SDK 目录不存在）"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" 2>&1 | tail -5 || true
          echo "已安装组件："
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-36|build-tools;35|ndk;26" || echo "（未检测到目标组件）"

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      # Release 构建会打包 JS bundle，APK 可脱离 Metro 独立运行；
      # 签名由 gradle 决定：无 keystore.properties 时自动使用仓库内置 debug.keystore（固定，可覆盖安装）
      - name: 构建 Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-release.log

      - name: 列出 APK 产物
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || echo "（未找到 APK）"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: yueyue-music-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*universal.apk
            android/app/build/outputs/apk/**/*arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      # artifact 的 Azure CDN 在部分网络下不可达，同步发布到 Release 作为可直连下载通道
      - name: 发布 APK 到 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: qtjay/yueyuemusic
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          mapfile -t files < <(find android/app/build/outputs/apk -type f -name '*.apk')
          gh release create latest "${files[@]}" \
            --title "APK 构建 #${GITHUB_RUN_NUMBER}" \
            --notes "commit ${GITHUB_SHA}"
          # 某些仓库策略会把新建 Release 落成 draft，draft 无法直连下载，这里强制发布
          gh release edit latest --draft=false

      - name: 上传构建日志（失败时便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 7
