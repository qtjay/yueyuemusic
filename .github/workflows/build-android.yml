name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Debug'
        type: choice
        options: [Debug, Release]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # GitHub Ubuntu 镜像自带 Android SDK，无需 setup-android（该 action 已不兼容新版 runner）
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 JS 依赖
        run: |
          npm config set legacy-peer-deps true
          npm config set fetch-retries 5
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 应用依赖补丁
        run: node dependencies-patch.js
        continue-on-error: true

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 校验 Android SDK 并准备工具链
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo "（SDK 目录不存在）"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" 2>&1 | tail -5 || true
          echo "已安装组件："
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-36|build-tools;35|ndk;26" || echo "（未检测到目标组件）"

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        if: ${{ github.event.inputs.build_type != 'Release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-debug.log
        env:
          ORG_GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

      - name: 准备签名密钥
        if: ${{ github.event.inputs.build_type == 'Release' }}
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/yueyue.keystore
            cat > keystore.properties <<EOF
          storeFile=yueyue.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: 构建 Release APK
        if: ${{ github.event.inputs.build_type == 'Release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ORG_GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

      - name: 上传构建日志（失败时便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: yueyue-music-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
